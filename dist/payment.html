  <!-- Razorpay checkout script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    (function() {
      const RAZORPAY_KEY = "rzp_test_RcoY8xdqpUgUXa"; // your test key_id
      const AMOUNT_IN_PAISE = 500; // ₹5.00 = 500 paise

      const payBtn = document.getElementById('payBtn');
      payBtn.addEventListener('click', openCheckout);

      function openCheckout() {
        const options = {
          key: RAZORPAY_KEY,
          amount: AMOUNT_IN_PAISE, // in paise
          currency: "INR",
          name: "NextPulse (Test)",
          description: "Entry fee ₹5",
          // image: "", // optional: your logo url
          // order_id: "", // optional if you create an order on server
          handler: function (response){
            // On successful payment — redirect to app.html with payment id
            // response contains razorpay_payment_id, razorpay_order_id (if set), razorpay_signature (if order_id used)
            try {
              const pid = encodeURIComponent(response.razorpay_payment_id || "");
              window.location.href = "app.html?payment_id=" + pid;
            } catch (e) {
              // fallback redirect
              window.location.href = "app.html";
            }
          },
          modal: {
            ondismiss: function(){
              // user closed the checkout without paying
              // you can optionally do nothing or show a message
              console.log("Checkout closed by user.");
            }
          },
          prefill: {
            // no prefill (user profile info not requested)
          },
          theme: {
            color: "#0a6cff"
          }
        };

        const rzp = new Razorpay(options);
        rzp.on('payment.failed', function (response){
          console.log("Payment failed:", response);
          alert("Payment failed. Please try again.");
        });

        rzp.open();
      }
    })();
  </script>

<!-- Rewarded ad logic (cooldown + out‑of‑page) -->
<script>
  (function() {
    const COOLDOWN_MS = 600000; // 1 hour
    const lastAdTime = localStorage.getItem('hasShownRewardedAd');
    const now = Date.now();
    if (lastAdTime && (now - parseInt(lastAdTime, 10)) < COOLDOWN_MS) {
      console.log('⏳ Ad cooldown active – skipping.');
      return;
    }

    window.googletag = window.googletag || { cmd: [] };
    googletag.cmd.push(() => {
      const adSlotRewarded = googletag
        .defineOutOfPageSlot('/23205238319/Rewarded_ads6', googletag.enums.OutOfPageFormat.REWARDED)
        .addService(googletag.pubads());

      adSlotRewarded.setForceSafeFrame(true);
      googletag.pubads().enableAsyncRendering();
      googletag.enableServices();

      const modal = document.getElementById('rewardModal');
      const closeButton = modal ? modal.querySelector('.btn') : null;

      window.addEventListener('popstate', function() {
        history.pushState(null, null, location.href);
      });

      googletag.pubads().addEventListener('impressionViewable', function() {
        console.log('👀 Ad impression viewable');
        if (closeButton) {
          setTimeout(() => { closeButton.style.display = 'block'; }, 30000);
        }
      });

      googletag.pubads().addEventListener('slotRenderEnded', function(event) {
        if (event.isEmpty) {
          console.log('❌ Ad empty or failed');
          if (modal) {
            modal.style.display = 'none';
          }
        }
      });

      googletag.pubads().addEventListener('rewardedSlotReady', function(event) {
        if (modal) {
          modal.style.display = 'flex'; // show modal
        }
        event.makeRewardedVisible();
      });

      googletag.pubads().addEventListener('rewardedSlotClosed', function() {
        if (modal) {
          modal.style.display = 'none';
        }
        localStorage.setItem('hasShownRewardedAd', Date.now().toString());
      });

      googletag.display(adSlotRewarded);
    });
  })();
</script>
