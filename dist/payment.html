<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pay ₹5 - Razorpay Test Checkout</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; display:flex; height:100vh;
           align-items:center; justify-content:center; background:#f6f8fa; margin:0; }
    .card { background:#fff; padding:28px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.08); width:320px; text-align:center; }
    button { background:#0a6cff; color:white; border:none; padding:12px 18px; border-radius:8px; font-size:16px; cursor:pointer; }
    button:active { transform:translateY(1px); }
    p.small { font-size:13px; color:#555; margin-top:12px; }
  </style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5920367457745298" crossorigin="anonymous"></script>
</head>
<body>
  <div class="card">
    <h2>Enter the site — ₹5</h2>
    <p>Secure test checkout (Razorpay)</p>
    <button id="payBtn">Pay ₹5</button>
    <p class="small">This uses Razorpay test key (client-side). After payment you'll be redirected to <code>appx.html</code>.</p>
  </div>

  <!-- Razorpay checkout script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    (function() {
      const RAZORPAY_KEY = "rzp_test_RcoY8xdqpUgUXa"; // your test key_id
      const AMOUNT_IN_PAISE = 500; // ₹5.00 = 500 paise

      const payBtn = document.getElementById('payBtn');
      payBtn.addEventListener('click', openCheckout);

      function openCheckout() {
        const options = {
          key: RAZORPAY_KEY,
          amount: AMOUNT_IN_PAISE, // in paise
          currency: "INR",
          name: "NextPulse (Test)",
          description: "Entry fee ₹5",
          // image: "", // optional: your logo url
          // order_id: "", // optional if you create an order on server
          handler: function (response){
            // On successful payment — redirect to appx.html with payment id
            // response contains razorpay_payment_id, razorpay_order_id (if set), razorpay_signature (if order_id used)
            try {
              const pid = encodeURIComponent(response.razorpay_payment_id || "");
              window.location.href = "appx.html?payment_id=" + pid;
            } catch (e) {
              // fallback redirect
              window.location.href = "appx.html";
            }
          },
          modal: {
            ondismiss: function(){
              // user closed the checkout without paying
              // you can optionally do nothing or show a message
              console.log("Checkout closed by user.");
            }
          },
          prefill: {
            // no prefill (user profile info not requested)
          },
          theme: {
            color: "#0a6cff"
          }
        };

        const rzp = new Razorpay(options);
        rzp.on('payment.failed', function (response){
          console.log("Payment failed:", response);
          alert("Payment failed. Please try again.");
        });

        rzp.open();
      }
    })();
  </script>
