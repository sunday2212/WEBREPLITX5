<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q Bank - LASTPULSE</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./qbank-main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="../access-control.js"></script>
    <script src="../block.js"></script>
    
<script src="../ads-adx.jss" defer></script>

</head>
<body>

    <script>
        // Initialize access control for protected page
        if (!accessControl.initProtectedPage()) {
            throw new Error('Access denied - redirecting to index.html');
        }
    </script>

    <header>
        <div class="header-content">
            <button onclick="history.back()" class="back-button">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 id="pageTitle">Q Bank</h1>
        </div>
    </header>

    <main>
        <div class="qbank-main-container">
            <div class="welcome-section">
                <h2>Q Bank Options</h2>
            </div>

            <!-- Main Options Grid -->
            <div class="main-options-grid">

                <!-- Question Bank Latest -->
                <div class="option-card quiz-card" onclick="window.location.href='Brain/index.html'">
                    <div class="option-icon">
                        <i class="fas fa-brain"></i>
                    </div>
                    <div class="option-content">
                        <h3>Question Bank Latest</h3>
                        <p>428K+ Questions | 5.8K+ Articles</p>
                    </div>
                    <div class="option-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>

                <!-- AI Q-BANK -->
                <div class="option-card" onclick="window.location.href='Aiquiz/index.html'">
                    <div class="option-icon">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="option-content">
                        <h3>AI Q-BANK</h3>
                    </div>
                    <div class="option-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>

            </div>
            <!-- /main-options-grid -->

            <!-- Stats Section -->
            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-item">
                        <i class="fas fa-question-circle"></i>
                        <span class="stat-number">500+</span>
                        <span class="stat-label">Questions</span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-graduation-cap"></i>
                        <span class="stat-number">3</span>
                        <span class="stat-label">Platforms</span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-book"></i>
                        <span class="stat-number">19+</span>
                        <span class="stat-label">Subjects</span>
                    </div>
                </div>
            </div>
            <!-- /stats-section -->

        </div>
        <!-- /23205238319/anchor_bottom1 -->

        <!-- /qbank-main-container -->
    </main>

    <script>
        // Load bookmark count on page load
        function loadBookmarkCount() {
            var saved = localStorage.getItem('quizBookmarks');
            var bookmarks = saved ? JSON.parse(saved) : [];
            var countElement = document.getElementById('bookmark-count');
            var count = bookmarks.length;
            countElement.textContent = count + ' question' + (count !== 1 ? 's' : '') + ' saved';
        }

        window.addEventListener('load', loadBookmarkCount);
    </script>

    <script src="../theme.js"></script>

    <nav class="bottom-nav">
        <a href="../appx.html" class="active"><i class="fas fa-lightbulb"></i><span>Home</span></a>
        <a href="../00x12345.html"><i class="fas fa-play-circle"></i><span>Videos</span></a>
        <a href="../searchx.html"><i class="fas fa-search"></i><span>Search</span></a>
        <a href="../quizx/index.html"><i class="fas fa-question-circle"></i><span>Q Bank</span></a>
    </nav>

</body>
</html>
