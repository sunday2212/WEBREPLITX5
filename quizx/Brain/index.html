  <script>
    let allManifestFiles = []; // For global search

    // Global Search - loads ONLY qbank entries (no articles)
    async function loadManifestForSearch() {
      try {
        const response = await fetch('./file-manifest.json');
        if (response.ok) {
          const manifest = await response.json();
          allManifestFiles = [];

          if (manifest.folders) {
            for (const [folderPath, folderData] of Object.entries(manifest.folders)) {
              const type = folderData.type || 'quiz';
              if (type === 'article') continue; // skip articles
              if (folderData.files && Array.isArray(folderData.files)) {
                const platform = folderPath.split('/')[0];
                folderData.files.forEach(fileName => {
                  allManifestFiles.push({
                    name: fileName.replace('.json', '').replace(/_/g, ' '),
                    path: `./${folderPath}/${fileName}`,
                    folderPath: folderPath,
                    platform: platform,
                    type: 'quiz'
                  });
                });
              }
            }
          }
        }
      } catch (e) {
        console.log('Could not load manifest for search');
      }
    }

    function handleGlobalSearch(event) {
      const query = event.target.value.toLowerCase().trim();
      const resultsContainer = document.getElementById('searchResults');

      if (query.length < 2) {
        resultsContainer.classList.remove('active');
        return;
      }

      const filtered = allManifestFiles.filter(file =>
        file.name.toLowerCase().includes(query) ||
        file.folderPath.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        resultsContainer.innerHTML = '<div class="search-result-item"><span>No results found</span></div>';
        resultsContainer.classList.add('active');
        return;
      }

      resultsContainer.innerHTML = filtered.slice(0, 15).map(file => `
        <div class="search-result-item" onclick="openSearchResult('${encodeURIComponent(file.path)}', '${encodeURIComponent(file.folderPath)}', '${encodeURIComponent(file.name)}')">
          <i class="fas fa-question-circle" style="color: #2c5282; flex-shrink: 0;"></i>
          <div style="flex: 1; min-width: 0;">
            <div class="result-title">${file.name}</div>
            <div class="result-path">${file.folderPath}</div>
          </div>
          <span style="font-size: 0.72rem; background: #ebf4ff; color: #2c5282; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;">${file.platform}</span>
        </div>
      `).join('');
      resultsContainer.classList.add('active');
    }

    function openSearchResult(encodedPath, encodedFolderPath, encodedName) {
      const filePath = decodeURIComponent(encodedPath);
      const folderPath = decodeURIComponent(encodedFolderPath);
      const fileName = decodeURIComponent(encodedName);
      // Pass directFile so quiz.html opens the mode modal immediately
      window.location.href = `quiz.html?directFile=${encodeURIComponent(filePath)}&folderPath=${encodeURIComponent(folderPath)}&folder=${encodeURIComponent(fileName)}`;
    }

    document.addEventListener('DOMContentLoaded', function () {
      loadMainCategories();
      loadManifestForSearch();

      // Show bookmark count on the card
      try {
        const raw = localStorage.getItem('qbkmarks');
        const bks = raw ? JSON.parse(raw) : [];
        const el = document.getElementById('bmCardCount');
        if (el) {
          el.textContent = bks.length > 0
            ? `${bks.length} saved question${bks.length !== 1 ? 's' : ''}`
            : 'No bookmarks yet — start practising!';
        }
      } catch (e) {}

      // Show custom module count
      try {
        const mRaw = localStorage.getItem('cm_v3');
        const mods = mRaw ? JSON.parse(mRaw) : [];
        const cmEl = document.getElementById('cmCardCount');
        if (cmEl) {
          cmEl.textContent = mods.length > 0
            ? `${mods.length}/3 module${mods.length !== 1 ? 's' : ''} saved — tap to manage`
            : 'Build your personal quiz sets';
        }
      } catch (e) {}
    });

    document.getElementById('searchInput').addEventListener('input', function (e) {
      const query = e.target.value.toLowerCase();
      const cards = document.querySelectorAll('.category-card');
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(query) ? 'flex' : 'none';
      });
    });
  </script>

<!-- Rewarded ad logic (cooldown + out‑of‑page) -->
<script>
  (function() {
    const COOLDOWN_MS = 600000; // 1 hour
    const lastAdTime = localStorage.getItem('hasShownRewardedAd');
    const now = Date.now();
    if (lastAdTime && (now - parseInt(lastAdTime, 10)) < COOLDOWN_MS) {
      console.log('⏳ Ad cooldown active – skipping.');
      return;
    }

    window.googletag = window.googletag || { cmd: [] };
    googletag.cmd.push(() => {
      const adSlotRewarded = googletag
        .defineOutOfPageSlot('/23205238319/Rewarded_ads6', googletag.enums.OutOfPageFormat.REWARDED)
        .addService(googletag.pubads());

      adSlotRewarded.setForceSafeFrame(true);
      googletag.pubads().enableAsyncRendering();
      googletag.enableServices();

      const modal = document.getElementById('rewardModal');
      const closeButton = modal ? modal.querySelector('.btn') : null;

      window.addEventListener('popstate', function() {
        history.pushState(null, null, location.href);
      });

      googletag.pubads().addEventListener('impressionViewable', function() {
        console.log('👀 Ad impression viewable');
        if (closeButton) {
          setTimeout(() => { closeButton.style.display = 'block'; }, 30000);
        }
      });

      googletag.pubads().addEventListener('slotRenderEnded', function(event) {
        if (event.isEmpty) {
          console.log('❌ Ad empty or failed');
          if (modal) {
            modal.style.display = 'none';
          }
        }
      });

      googletag.pubads().addEventListener('rewardedSlotReady', function(event) {
        if (modal) {
          modal.style.display = 'flex'; // show modal
        }
        event.makeRewardedVisible();
      });

      googletag.pubads().addEventListener('rewardedSlotClosed', function() {
        if (modal) {
          modal.style.display = 'none';
        }
        localStorage.setItem('hasShownRewardedAd', Date.now().toString());
      });

      googletag.display(adSlotRewarded);
    });
  })();
</script>
