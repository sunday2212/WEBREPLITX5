<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../quiz-styles.css">
  <link rel="stylesheet" href="brain-styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="../../theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase-config.js"></script>
  <script src="../../access-control.js"></script>
  <script src="../../block.js"></script>
  <style>
    /* ── Loading ─────────────────────────────────────────────────── */
    .loading-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60vh; gap: 1rem; text-align: center; padding: 2rem;
    }
    .loading-screen .spinner { font-size: 2.5rem; color: #2c5282; }
    .loading-screen p { color: #718096; font-size: 0.95rem; }
    .loading-progress {
      width: 200px; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden;
    }
    .loading-progress-bar {
      height: 100%; background: linear-gradient(90deg, #2c5282, #3182ce);
      border-radius: 3px; transition: width 0.3s; width: 0%;
    }

    /* ── Header meta bar ────────────────────────────────────────── */
    .cq-header-meta {
      background: linear-gradient(135deg, #2c5282 0%, #5a67d8 100%);
      padding: 0.6rem 1rem; margin-bottom: 0; font-size: 0.8rem; color: rgba(255,255,255,0.85);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .cq-header-meta i { font-size: 0.75rem; }

    /* ── Error screen ───────────────────────────────────────────── */
    .error-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 50vh; gap: 1rem; text-align: center; padding: 2rem;
    }
    .error-screen i { font-size: 3rem; color: #e53e3e; }
    .error-screen p { color: #718096; }
    .error-screen a { color: #2c5282; font-weight: 600; }

    /* ── Mode selection screen ──────────────────────────────────── */
    #modeScreen .mode-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .mode-modal-option {
      padding: 1rem 1.25rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .mode-modal-option:hover {
      border-color: #2c5282;
      background: #f7fafc;
    }
    .mode-modal-option.selected {
      border-color: #2c5282;
      background: #ebf4ff;
    }
    .mode-modal-option .mode-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; flex-shrink: 0;
    }
    .mode-modal-option.normal-mode .mode-icon {
      background: linear-gradient(135deg, #3182ce 0%, #63b3ed 100%);
      color: white;
    }
    .mode-modal-option.test-mode .mode-icon {
      background: linear-gradient(135deg, #d69e2e 0%, #ecc94b 100%);
      color: white;
    }
    .mode-modal-option .mode-content { flex: 1; }
    .mode-modal-option .mode-title {
      font-weight: 600; font-size: 1rem; color: #2d3748; margin-bottom: 0.25rem;
    }
    .mode-modal-option .mode-desc {
      font-size: 0.8rem; color: #718096; line-height: 1.4;
    }
    .mode-modal-option .mode-check {
      width: 24px; height: 24px;
      border: 2px solid #cbd5e0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; transition: all 0.2s; flex-shrink: 0;
    }
    .mode-modal-option.selected .mode-check {
      background: #38a169; border-color: #38a169;
    }

    /* ── Nav buttons (Prev / Next) ──────────────────────────────── */
    .nav-buttons {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      padding: 0 0.5rem;
    }
    .nav-btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s;
      border: none;
    }
    .prev-btn {
      background: #e2e8f0;
      color: #2d3748;
    }
    .prev-btn:hover:not(:disabled) {
      background: #cbd5e0;
    }
    .prev-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .next-btn {
      background: linear-gradient(135deg, #38a169, #48bb78);
      color: white;
      box-shadow: 0 4px 12px rgba(56,161,105,0.3);
    }
    .next-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(56,161,105,0.4);
    }

    /* ── Bookmark button ────────────────────────────────────────── */
    .bookmark-question-btn {
      position: absolute;
      top: 0.75rem; right: 0.75rem;
      background: white;
      border: 2px solid #f59e0b;
      border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 10;
      transition: all 0.2s;
      padding: 0;
    }
    .bookmark-question-btn i {
      font-size: 1rem;
      color: #f59e0b;
      transition: all 0.2s;
    }
    .bookmark-question-btn:hover {
      background: #fef3c7;
      transform: scale(1.05);
      border-color: #d97706;
    }
    .bookmark-question-btn.bookmarked {
      background: #fef3c7;
      border-color: #d97706;
    }
    .bookmark-question-btn.bookmarked i {
      color: #d97706;
    }

    /* ── Timer (test mode) ──────────────────────────────────────── */
    .quiz-timer {
      display: flex; align-items: center; gap: 0.4rem;
      background: #eef2ff; border: 1.5px solid #c7d2fe;
      border-radius: 8px; padding: 0.35rem 0.65rem;
      font-weight: 700; font-size: 0.9rem; color: #3730a3;
      white-space: nowrap; margin-bottom: 0.75rem;
    }
    .quiz-timer.warning { background: #fef3c7; border-color: #fcd34d; color: #d97706; }
    .quiz-timer.danger  { background: #fee2e2; border-color: #fca5a5; color: #dc2626; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }

    /* ── Top-right of question card ─────────────────────────────── */
    .quiz-top-right {
      position: absolute;
      top: 0.75rem; right: 0.75rem;
      display: flex; align-items: center; gap: 0.5rem;
      z-index: 10;
    }
    .quiz-top-right .bookmark-question-btn {
      position: static !important;
      top: auto !important; right: auto !important;
    }

    /* Padding so question text never slides under the bookmark button */
    .question-container .question-text {
      padding-right: 52px;
    }

    /* ── Answer result badge ────────────────────────────────────── */
    .answer-result { font-weight: 700; font-size: 1rem; }
    .explanation-header { margin-bottom: 0.75rem; }

    /* ── Option state aliases (wrong = incorrect, disabled = neutral) */
    .option-btn.wrong {
      background: #fee2e2; border-color: #ef4444; color: #991b1b;
    }
    .option-btn.wrong .option-label { background: #ef4444; }
    .option-btn.disabled { opacity: 0.55; cursor: not-allowed; }
    .option-btn.selected-test {
      background: #e2e8f0; border-color: #2c5282;
    }
    html:not([data-theme="light"]) .option-btn.wrong {
      background: #450a0a; border-color: #ef4444; color: #fecaca;
    }
    html:not([data-theme="light"]) .option-btn.selected-test {
      background: #1e2235; border-color: #3182ce;
    }

    /* ================================================================
       DARK MODE overrides
       ================================================================ */
    html:not([data-theme="light"]) .loading-screen p { color: #8892a4; }
    html:not([data-theme="light"]) .loading-progress { background: #2a3045; }

    html:not([data-theme="light"]) #modeScreen .mode-card {
      background: #1a1d2e;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    html:not([data-theme="light"]) #modeScreen h2 { color: #e2e8f0; }
    html:not([data-theme="light"]) #modeScreen p  { color: #8892a4; }

    html:not([data-theme="light"]) .mode-modal-option {
      border-color: #2a3045;
    }
    html:not([data-theme="light"]) .mode-modal-option:hover {
      border-color: #3182ce; background: #1e2235;
    }
    html:not([data-theme="light"]) .mode-modal-option.selected {
      border-color: #3182ce; background: #1e2a40;
    }
    html:not([data-theme="light"]) .mode-modal-option .mode-title { color: #e2e8f0; }
    html:not([data-theme="light"]) .mode-modal-option .mode-desc  { color: #8892a4; }
    html:not([data-theme="light"]) .mode-modal-option .mode-check { border-color: #3a4055; }

    html:not([data-theme="light"]) .prev-btn {
      background: #252b3b;
      color: #e2e8f0;
    }
    html:not([data-theme="light"]) .prev-btn:hover:not(:disabled) {
      background: #2a3045;
    }

    html:not([data-theme="light"]) .bookmark-question-btn {
      background: #252b3b;
      border-color: #d97706;
    }
    html:not([data-theme="light"]) .bookmark-question-btn:hover {
      background: #3a2f1a;
    }
    html:not([data-theme="light"]) .bookmark-question-btn.bookmarked {
      background: #3a2f1a;
      border-color: #d97706;
    }

    html:not([data-theme="light"]) .quiz-timer {
      background: #1e2235; border-color: #3730a3; color: #a5b4fc;
    }
    html:not([data-theme="light"]) .quiz-timer.warning { background: #2d2310; border-color: #92400e; color: #fcd34d; }
    html:not([data-theme="light"]) .quiz-timer.danger  { background: #2d0f0f; border-color: #7f1d1d; color: #fca5a5; }

    html:not([data-theme="light"]) .error-screen p { color: #8892a4; }
    html:not([data-theme="light"]) .error-screen a { color: #63b3ed; }

    /* results screen dark */
    html:not([data-theme="light"]) #results-container > div {
      background: #1a1d2e !important;
    }
    html:not([data-theme="light"]) #resultsTitle { color: #e2e8f0 !important; }
    html:not([data-theme="light"]) #resultsDetail { color: #8892a4 !important; }
    html:not([data-theme="light"]) #resCorrect { color: #68d391 !important; }
    html:not([data-theme="light"]) #resWrong   { color: #fc8181 !important; }

    /* test submit bar dark */
    html:not([data-theme="light"]) #testSubmitBar button {
      background: #9b1c1c !important;
    }
  </style>

  <header>
    <div class="header-content">
      <button onclick="goBackSafe()" class="back-button" style="display:block;">

        <div class="spinner"><i class="fas fa-spinner fa-spin"></i></div>

  <script>
  // ─── State ────────────────────────────────────────────────────────────────
  let moduleConfig = null;
  let manifest = null;
  let currentQuiz = [];
  let currentQuestionIndex = 0;
  let userAnswers = [];
  let score = 0;
  let quizMode = 'normal';
  let timerInterval = null;
  let remainingTimeSeconds = 0;
  let totalTimeSeconds = 0;

  // ─── Init ─────────────────────────────────────────────────────────────────
  async function init() {
    try {
      const raw = sessionStorage.getItem('cm_active');
      if (!raw) throw new Error('No module data');
      moduleConfig = JSON.parse(raw);
      document.getElementById('pageTitle').textContent = moduleConfig.name;
      document.getElementById('pageSubtitle').textContent = `${moduleConfig.qCount} Questions`;

      const meta = document.getElementById('headerMeta');
      meta.style.display = 'flex';
      const pLabel = moduleConfig.pm === 'all' ? 'All Platforms' :
                     moduleConfig.pm === 'rnd'  ? 'Random Platform' :
                     (moduleConfig.picks || []).join(', ') || 'Custom';
      const folderCount = (moduleConfig.selPaths || []).length;
      document.getElementById('headerMetaText').textContent = `${pLabel} · ${folderCount} folders`;
    } catch(e) {
      showError('Invalid module configuration. Please go back and start your module again.');
      return;
    }

    setProgress(10);
    setLoadMsg('Loading question bank index…');
    const r = await fetch('./file-manifest.json');
    manifest = await r.json();
    setProgress(25);
    setLoadMsg('Picking random questions…');
    await buildQuiz();
  }

  // ─── Build quiz  (equal-distribution + random interleave) ───────────────────
  //
  // Algorithm overview:
  //   1. Each selected path becomes one "group" (could be a file, topic, chapter,
  //      subject, platform — whatever the user picked in the module builder).
  //   2. The target question count is split as evenly as possible across all groups.
  //   3. We fetch only the files needed to fill each group's quota — in parallel.
  //   4. If a group is exhausted (too few questions), its unmet quota is
  //      redistributed to groups that still have files left.
  //   5. Redistribution is iterated up to 3 times to handle cascading shortfalls.
  //   6. Questions from all groups are interleaved round-robin (with shuffled
  //      group order each round) so consecutive questions never all come from
  //      the same topic.
  //
  async function buildQuiz() {
    const selPaths = moduleConfig.selPaths || [];
    if (!selPaths.length) {
      showError('No folders selected in this module. Please edit it.');
      return;
    }

    const target  = parseInt(moduleConfig.qCount) || 10;
    const folders = manifest.folders || {};

    // ── Step 1: Build groups ─────────────────────────────────────────────────
    // Each selPath → one group object with a shuffled list of file URLs.
    // The group tracks how far along we've loaded (fileIdx) and all questions
    // loaded so far (pool), as well as how many have been allocated (allocated).
    const groups = [];
    for (const sp of selPaths) {
      let urls;
      if (sp.endsWith('.json')) {
        urls = [`./${sp}`];
      } else {
        const info = folders[sp];
        if (!info || info.type === 'article') continue;
        urls = (info.files || []).filter(f => f.endsWith('.json')).map(f => `./${sp}/${f}`);
      }
      if (!urls.length) continue;
      groups.push({
        label:    sp,
        urls:     shuffle([...urls]),   // shuffle file order within group
        fileIdx:  0,                    // next file to load
        pool:     [],                   // all loaded questions (shuffled on arrival)
        exhausted: false                // true when no more files remain
      });
    }

    if (!groups.length) {
      showError('No quiz files found for this configuration. Please edit your module.');
      return;
    }

    const K = groups.length;

    // ── Step 2: Assign initial quotas  (base + 1 for first `rem` groups) ────
    //   e.g. target=10, K=3  →  quotas = [4, 3, 3]
    let quotas = Array.from({length: K}, (_, i) =>
      Math.floor(target / K) + (i < (target % K) ? 1 : 0)
    );

    // ── Step 3: Fetch + redistribute (up to 3 rounds) ───────────────────────
    // Each round:  load from each group until its quota is satisfied (or it
    // runs out of files), then redistribute any shortfall to groups with
    // remaining capacity.
    const buckets = Array.from({length: K}, () => []);  // final questions per group

    for (let round = 0; round < 3; round++) {
      setLoadMsg(round === 0
        ? 'Distributing questions equally…'
        : `Redistributing shortfall (pass ${round + 1})…`);
      setProgress(20 + round * 20);

      // Fetch in parallel — each group fills up to its quota
      await Promise.all(groups.map(async (g, i) => {
        const need = quotas[i] - buckets[i].length;
        if (need <= 0 || g.exhausted) return;
        const newQs = await _loadFromGroup(g, need);
        buckets[i].push(...newQs);
      }));

      // Check if we have enough overall
      const totalGot = buckets.reduce((s, b) => s + b.length, 0);
      if (totalGot >= target) break;

      // Find shortfalls (groups that couldn't fill their quota)
      let totalShortfall = 0;
      const shortfall = quotas.map((q, i) => {
        const sf = Math.max(0, q - buckets[i].length);
        totalShortfall += sf;
        return sf;
      });
      if (!totalShortfall) break;

      // Identify groups that still have unloaded files and aren't behind on their quota
      const eligible = groups.reduce((acc, g, i) => {
        if (!g.exhausted && shortfall[i] === 0) acc.push(i);
        return acc;
      }, []);
      if (!eligible.length) break;

      // Distribute totalShortfall as evenly as possible among eligible groups
      const extraBase = Math.floor(totalShortfall / eligible.length);
      const extraRem  = totalShortfall % eligible.length;
      eligible.forEach((gi, j) => {
        quotas[gi] += extraBase + (j < extraRem ? 1 : 0);
      });
      // Cap exhausted groups at what they actually delivered
      shortfall.forEach((sf, i) => {
        if (sf > 0) quotas[i] = buckets[i].length;
      });
    }

    setProgress(85);
    setLoadMsg('Mixing questions…');

    // ── Step 4: Round-robin interleave ───────────────────────────────────────
    // Each "round" we shuffle which group goes first, then take one question
    // from each group that still has questions.  Result: maximally mixed.
    const finalPool = _interleaveGroups(buckets);
    const questions = finalPool.slice(0, target);

    if (!questions.length) {
      // Diagnose WHY there are no questions
      const totalNotFound = groups.reduce((s, g) => s + (g.notFound || 0), 0);
      const totalFound    = groups.reduce((s, g) => s + (g.found    || 0), 0);
      if (totalNotFound > 0 && totalFound === 0) {
        // ALL files returned 404 — content not uploaded yet
        const platforms = [...new Set(groups.map(g => g.label.split('/')[0]))].join(', ');
        showError(
          `Question files for "${platforms}" are not yet available on this server. ` +
          `Only content that has been uploaded (e.g. Cerebellum) can be used. ` +
          `Please select a topic from an available platform.`
        );
      } else if (totalFound > 0) {
        // Files loaded but no questions passed validation
        showError('The selected files loaded but contained no valid MCQ questions. Try selecting a different topic.');
      } else {
        showError('No quiz files could be reached. Please check your connection and try again.');
      }
      return;
    }

    const totalAvail = buckets.reduce((s, b) => s + b.length, 0);
    if (totalAvail < target) {
      console.warn(`Only ${totalAvail} questions available (requested ${target}).`);
    }

    setProgress(100);
    currentQuiz = questions;
    userAnswers  = new Array(questions.length).fill(null);

    setTimeout(() => {
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('modeScreen').style.display   = 'block';
      document.getElementById('modeModuleName').textContent    = moduleConfig.name;
      document.getElementById('modeQuestionCount').textContent = `${questions.length} questions ready`;
      selectMode('normal');
    }, 300);
  }

  // ── Helper: load up to `needed` questions from a group's file list ──────────
  // Loads files in batches of 8 (parallel), stopping as soon as enough
  // questions are gathered or all files are consumed.
  // Files already loaded (tracked by group.fileIdx) are never re-fetched.
  // Updates group.notFound (count of 404s) and group.found (count of successful files).
  async function _loadFromGroup(group, needed) {
    const FILE_BATCH = 8;
    const result = [];

    while (result.length < needed && !group.exhausted) {
      const batch = group.urls.slice(group.fileIdx, group.fileIdx + FILE_BATCH);
      group.fileIdx += batch.length;
      if (group.fileIdx >= group.urls.length) group.exhausted = true;
      if (!batch.length) break;

      const responses = await Promise.allSettled(
        batch.map(url =>
          fetch(url)
            .then(r => {
              if (!r.ok) { group.notFound = (group.notFound || 0) + 1; return null; }
              group.found = (group.found || 0) + 1;
              return r.json();
            })
            .catch(() => { group.notFound = (group.notFound || 0) + 1; return null; })
        )
      );

      for (let ri = 0; ri < responses.length; ri++) {
        const res = responses[ri];
        if (res.status !== 'fulfilled' || !res.value) continue;
        const fileUrl = batch[ri];
        const data = res.value;
        let rawQs = Array.isArray(data) ? data : (data.questions || []);
        // Tag each question with its source file URL and index-in-file BEFORE shuffle
        const qs = rawQs.map((rawQ, fileIdx) => {
          const nq = normalizeQuestion(rawQ, fileIdx);
          if (!nq || !nq.question || !nq.options || !nq.correct_answer) return null;
          nq._filePath = fileUrl;           // e.g. "./Cerebellum/qBank/Anatomy/..."
          nq._fileQuestionIdx = fileIdx;    // original index inside the JSON array
          return nq;
        }).filter(Boolean);
        shuffle(qs);           // randomise within each file
        result.push(...qs);
      }
    }

    // Shuffle across the whole batch result, then return exactly `needed`
    return shuffle(result).slice(0, needed);
  }

  // ── Helper: mix questions from all buckets into a truly random order ─────────
  //
  // Strategy: weighted random draw
  //   At each position we randomly pick which group to take from, weighted by
  //   how many questions each group still has remaining.  This means:
  //     • Groups with more remaining questions are proportionally more likely to go next
  //     • Any group CAN appear consecutively (natural randomness)
  //     • No group is starved — it contributes proportionally throughout
  //
  //   Example with [5, 5]: result feels like G2 G1 G1 G2 G1 G2 G2 G1 G2 G1
  //   (not the mechanical G1 G2 G1 G2 G1 G2 of round-robin)
  //
  function _interleaveGroups(buckets) {
    const ptrs   = Array(buckets.length).fill(0);
    const result = [];

    while (true) {
      // Build a weighted pool: each group contributes one slot per remaining question
      let totalRemaining = 0;
      for (let i = 0; i < buckets.length; i++) {
        totalRemaining += buckets[i].length - ptrs[i];
      }
      if (totalRemaining === 0) break;

      // Pick a random position in [0, totalRemaining) and find which group it maps to
      let pick = Math.floor(Math.random() * totalRemaining);
      for (let i = 0; i < buckets.length; i++) {
        const remaining = buckets[i].length - ptrs[i];
        if (pick < remaining) {
          result.push(buckets[i][ptrs[i]++]);
          break;
        }
        pick -= remaining;
      }
    }

    return result;
  }

  // ─── Mode selection ───────────────────────────────────────────────────────
  function selectMode(mode) {
    quizMode = mode;
    document.getElementById('modeNormal').classList.toggle('selected', mode === 'normal');
    document.getElementById('modeTest').classList.toggle('selected', mode === 'test');
  }

  function startQuiz() {
    document.getElementById('modeScreen').style.display = 'none';
    document.getElementById('quiz-container').style.display = 'block';
    currentQuestionIndex = 0;
    score = 0;
    userAnswers = new Array(currentQuiz.length).fill(null);
    if (quizMode === 'test') {
      startTimer();
      document.getElementById('testSubmitBar').style.display = 'block';
      document.getElementById('explanation-container').style.display = 'none';
    }
    loadQuestion();
  }

  // ─── Question rendering ───────────────────────────────────────────────────
  function loadQuestion() {
    const q = currentQuiz[currentQuestionIndex];
    document.getElementById('current-question').textContent = currentQuestionIndex + 1;
    document.getElementById('total-questions').textContent = currentQuiz.length;
    document.getElementById('question-text').innerHTML = `<strong>Q${currentQuestionIndex + 1}.</strong> ${q.question}`;

    // Image
    const imgDiv = document.getElementById('question-image');
    if (q.image) {
      document.getElementById('question-img').src = q.image;
      imgDiv.style.display = 'block';
    } else {
      imgDiv.style.display = 'none';
    }

    // Options
    const opts = document.getElementById('options-container');
    opts.innerHTML = '';
    if (q.options) {
      Object.entries(q.options).forEach(([key, val]) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        const prev = userAnswers[currentQuestionIndex];
        if (quizMode === 'test' && prev === key) btn.classList.add('selected-test');
        if (quizMode === 'normal' && prev !== null) {
          if (key === q.correct_answer) btn.classList.add('correct');
          else if (prev === key) btn.classList.add('wrong');
          else btn.classList.add('disabled');
          btn.disabled = true;
        }
        btn.innerHTML = `<span class="option-label">${key}</span><span class="option-text">${val}</span>`;
        btn.onclick = () => selectAnswer(key);
        opts.appendChild(btn);
      });
    }

    // Explanation (normal mode)
    if (quizMode === 'normal' && userAnswers[currentQuestionIndex] !== null) {
      showExplanation(q, userAnswers[currentQuestionIndex]);
    } else {
      document.getElementById('explanation-container').style.display = 'none';
    }

    // Bookmark
    updateBookmarkBtn();
    document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
    document.getElementById('next-btn').textContent = currentQuestionIndex === currentQuiz.length - 1 ? 'Finish' : 'Next ';
    document.getElementById('next-btn').innerHTML = currentQuestionIndex === currentQuiz.length - 1
      ? 'Finish <i class="fas fa-flag-checkered"></i>'
      : 'Next <i class="fas fa-chevron-right"></i>';
  }

  function selectAnswer(key) {
    if (quizMode === 'normal' && userAnswers[currentQuestionIndex] !== null) return;
    const q = currentQuiz[currentQuestionIndex];
    userAnswers[currentQuestionIndex] = key;

    if (quizMode === 'normal') {
      if (key === q.correct_answer) score++;
      // Update option styles
      document.querySelectorAll('.option-btn').forEach(btn => {
        const k = btn.querySelector('.option-label').textContent;
        if (k === q.correct_answer) btn.classList.add('correct');
        else if (k === key) btn.classList.add('wrong');
        else btn.classList.add('disabled');
        btn.disabled = true;
      });
      showExplanation(q, key);
    } else {
      // Test mode: just highlight selected
      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.classList.remove('selected-test');
        const k = btn.querySelector('.option-label').textContent;
        if (k === key) btn.classList.add('selected-test');
      });
    }
  }

  function showExplanation(q, chosen) {
    const isCorrect = chosen === q.correct_answer;
    const container = document.getElementById('explanation-container');
    container.style.display = 'block';
    document.getElementById('answer-result').innerHTML = isCorrect
      ? '<i class="fas fa-check-circle" style="color:#38a169;"></i> Correct!'
      : '<i class="fas fa-times-circle" style="color:#e53e3e;"></i> Wrong';
    document.getElementById('correct-answer-text').innerHTML =
      `<strong>Correct Answer: ${q.correct_answer}</strong>`;
    document.getElementById('explanation-text').innerHTML = q.explanation || '<em>No explanation available.</em>';

    const expImgContainer = document.getElementById('explanation-image-container');
    if (q.explanation_image) {
      document.getElementById('explanation-img').src = q.explanation_image;
      expImgContainer.style.display = 'block';
    } else {
      expImgContainer.style.display = 'none';
    }
    
  }

  function prevQuestion() {
    if (currentQuestionIndex > 0) { currentQuestionIndex--; loadQuestion(); scrollToTop(); }
  }

  function nextQuestion() {
    if (currentQuestionIndex < currentQuiz.length - 1) {
      currentQuestionIndex++;
      loadQuestion();
      scrollToTop();
    } else {
      if (quizMode === 'test') finishTestMode();
      else showResults();
    }
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ─── Test mode timer ───────────────────────────────────────────────────────
  function startTimer() {
    stopTimer();
    totalTimeSeconds = currentQuiz.length * 60;
    remainingTimeSeconds = totalTimeSeconds;
    document.getElementById('quizTimer').style.display = 'flex';
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      remainingTimeSeconds--;
      updateTimerDisplay();
      if (remainingTimeSeconds <= 0) {
        stopTimer();
        alert("Time's up! Submitting your answers.");
        finishTestMode();
      }
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    document.getElementById('quizTimer').style.display = 'none';
  }

  function updateTimerDisplay() {
    const m = Math.floor(remainingTimeSeconds / 60);
    const s = remainingTimeSeconds % 60;
    document.getElementById('timerDisplay').textContent =
      `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const timer = document.getElementById('quizTimer');
    const pct = remainingTimeSeconds / totalTimeSeconds;
    timer.classList.toggle('danger', pct <= 0.1);
    timer.classList.toggle('warning', pct > 0.1 && pct <= 0.25);
  }

  function finishTestMode() {
    stopTimer();
    document.getElementById('testSubmitBar').style.display = 'none';
    // Score all answers
    score = userAnswers.filter((a, i) => a !== null && a === currentQuiz[i].correct_answer).length;
    // Show all correct/wrong
    showResults();
  }

  // ─── Results ───────────────────────────────────────────────────────────────
  function showResults() {
    stopTimer();
    document.getElementById('quiz-container').style.display = 'none';
    document.getElementById('results-container').style.display = 'block';
    const answered = userAnswers.filter(a => a !== null).length;
    const pct = Math.round((score / currentQuiz.length) * 100);
    const icon = pct >= 70 ? '🎉' : pct >= 40 ? '📚' : '💪';
    document.getElementById('resultsIcon').textContent = icon;
    document.getElementById('resultsTitle').textContent = pct >= 70 ? 'Great Job!' : pct >= 40 ? 'Keep Practicing!' : 'Keep Going!';
    document.getElementById('resultsScore').textContent = `${pct}%`;
    document.getElementById('resultsDetail').textContent = `${score} of ${currentQuiz.length} correct · ${answered} answered`;
    document.getElementById('resCorrect').textContent = score;
    document.getElementById('resWrong').textContent = answered - score;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function restartQuiz() {
    document.getElementById('results-container').style.display = 'none';
    document.getElementById('loadingScreen').style.display = 'flex';
    document.getElementById('progressBar').style.width = '0%';
    setLoadMsg('Building a new random set…');
    setProgress(10);
    buildQuiz();
  }

  // ─── Bookmarks ─────────────────────────────────────────────────────────────
  function _bookmarkKey(q, idx) {
    // Prefer file-based key (stable across quiz restarts); fallback to position key
    const fp = (q._filePath || '').replace(/^\.\//, '');
    return fp
      ? `${fp}::${q._fileQuestionIdx ?? idx}`
      : `custom_${idx}_${q.q_no}`;
  }

  function toggleBookmark() {
    const q = currentQuiz[currentQuestionIndex];
    if (!q) return;
    const bookmarks = getBookmarks();
    const key = _bookmarkKey(q, currentQuestionIndex);

    // Support both new format (id) and old legacy format (_customKey)
    const existingIdx = bookmarks.findIndex(b => b.id === key || b._customKey === key);
    if (existingIdx > -1) {
      bookmarks.splice(existingIdx, 1);
    } else {
      // Build the standard qbkmarks format that bookmarks.html understands
      const rawFp  = (q._filePath || '').replace(/^\.\//, '');
      const parts  = rawFp ? rawFp.split('/') : [];
      const platform   = parts[0] || 'Custom';
      const topicName  = (parts[parts.length - 1] || '').replace(/\.json$/i, '') || 'Custom';
      const folderPath = parts.slice(0, -1).join('/');
      bookmarks.push({
        id:            key,
        filePath:      rawFp || '',
        questionIndex: q._fileQuestionIdx ?? currentQuestionIndex,
        qNo:           q.q_no || (currentQuestionIndex + 1),
        platform:      platform,
        folderPath:    folderPath,
        topicName:     topicName,
        bookmarkedAt:  new Date().toISOString()
      });
    }
    saveBookmarks(bookmarks);
    updateBookmarkBtn();
  }

  function getBookmarks() {
    try { return JSON.parse(localStorage.getItem('qbkmarks') || '[]'); } catch(e) { return []; }
  }
  function saveBookmarks(bks) {
    try { localStorage.setItem('qbkmarks', JSON.stringify(bks)); } catch(e) {}
  }
  function updateBookmarkBtn() {
    const q = currentQuiz[currentQuestionIndex];
    if (!q) return;
    const bookmarks = getBookmarks();
    const key = _bookmarkKey(q, currentQuestionIndex);
    const isBookmarked = bookmarks.some(b => b.id === key || b._customKey === key);
    const btn = document.getElementById('bookmark-btn');
    if (btn) {
      btn.classList.toggle('bookmarked', isBookmarked);
      const icon = btn.querySelector('i');
      if (icon) {
        icon.className = isBookmarked ? 'fas fa-bookmark' : 'far fa-bookmark';
      }
      btn.title = isBookmarked ? 'Remove bookmark' : 'Bookmark this question';
    }
  }

  // ─── Helpers ───────────────────────────────────────────────────────────────
  function normalizeQuestion(q, index) {
    // Old Cerebellum/BTR format: choices array with numeric ids + correct_choice_id
    if (q.choices && Array.isArray(q.choices)) {
      const options = {};
      const labels = ['A','B','C','D','E','F','G','H'];
      let correct = '';
      q.choices.forEach((c, i) => {
        const label = labels[i] || String(i+1);
        options[label] = stripHtml(c.text || c);
        if (c.id === q.correct_choice_id) correct = label;
      });
      return {
        q_no: q.id || (index+1),
        question: stripHtml(q.text || q.question || ''),
        options,
        correct_answer: correct,
        explanation: q.solution || q.explanation || '',
        image: extractImg(q.text) || (q.question_images?.[0]) || null,
        explanation_image: extractImg(q.solution) || (q.explanation_images?.[0]) || null,
        tags: q.tags || [],
        difficulty: q.difficulty_level || 'intermediate'
      };
    }
    // CoreBTR format: options is an array of {id: "A"/"B"/"C"/"D", text, is_correct}
    if (q.options && Array.isArray(q.options)) {
      const options = {};
      let correct = '';
      q.options.forEach(opt => {
        options[opt.id] = opt.text || '';
        if (opt.is_correct) correct = opt.id;
      });
      return {
        q_no: index + 1,
        question: q.text || '',
        options,
        correct_answer: correct,
        explanation: convertMarkdownToHtml(q.explanation || ''),
        image: (q.images && q.images.length > 0 && q.images[0].url) ? q.images[0].url : null,
        explanation_image: null,
        tags: q.tags || [],
        difficulty: q.difficulty || 'intermediate'
      };
    }
    // Plain object format: options is already a {A: text, B: text} map
    if (q.options && typeof q.options === 'object') {
      return {
        q_no: q.q_no || q.id || (index+1),
        question: q.question || '',
        options: q.options,
        correct_answer: q.correct_answer || '',
        explanation: q.explanation || '',
        image: q.image || null,
        explanation_image: q.explanation_image || null,
        tags: q.tags || [],
        difficulty: q.difficulty || 'intermediate'
      };
    }
    return null;
  }

  function convertMarkdownToHtml(md) {
    if (!md) return '';
    let text = md.replace(/<br\s*\/?>/gi, '\n');
    const lines = text.split('\n');
    const out = [];
    let listItems = [];

    const flushList = () => {
      if (listItems.length > 0) {
        out.push('<ul style="margin:0.4em 0 0.4em 1.2em;padding:0;">' + listItems.join('') + '</ul>');
        listItems = [];
      }
    };

    const inline = (s) => {
      s = s.replace(/\\([.*\-+\[\]()#!\\])/g, '$1');
      s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/_(.*?)_/g, '<em>$1</em>');
      return s;
    };

    for (let line of lines) {
      const t = line.trim();
      const hm = t.match(/^(#{1,6})\s+(.+)$/);
      if (hm) {
        flushList();
        out.push('<p style="margin:0.5em 0 0.2em;"><strong>' + inline(hm[2]) + '</strong></p>');
        continue;
      }
      const bm = t.match(/^[*\-]\s+(.+)$/);
      if (bm) {
        listItems.push('<li style="margin:0.15em 0;">' + inline(bm[1]) + '</li>');
        continue;
      }
      if (!t) {
        flushList();
        out.push('<div style="height:0.4em;"></div>');
        continue;
      }
      flushList();
      out.push('<p style="margin:0.35em 0;">' + inline(t) + '</p>');
    }
    flushList();
    return out.join('');
  }

  function stripHtml(html) {
    if (!html) return '';
    const d = document.createElement('div');
    d.innerHTML = html;
    return d.textContent || d.innerText || '';
  }

  function extractImg(html) {
    if (!html) return null;
    const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
    return m ? m[1] : null;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function setProgress(pct) {
    document.getElementById('progressBar').style.width = pct + '%';
  }

  function setLoadMsg(msg) {
    document.getElementById('loadingMsg').textContent = msg;
  }

  function showError(msg) {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('errorScreen').style.display = 'flex';
    document.getElementById('errorMsg').textContent = msg;
  }

  function goBackSafe() {
    window.location.href = 'custom-module.html';
  }

  init();
  </script>
