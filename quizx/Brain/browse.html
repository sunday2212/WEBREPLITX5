  <script>
    let allManifestFiles = []; // For global search
    
    // Global Search
    async function loadManifestForSearch() {
      try {
        const response = await fetch('./file-manifest.json');
        if (response.ok) {
          const manifest = await response.json();
          allManifestFiles = [];
          
          if (manifest.folders) {
            for (const [folderPath, folderData] of Object.entries(manifest.folders)) {
              if (folderData.files && Array.isArray(folderData.files)) {
                folderData.files.forEach(fileName => {
                  allManifestFiles.push({
                    name: fileName.replace('.json', '').replace(/_/g, ' '),
                    path: `./${folderPath}/${fileName}`,
                    folderPath: folderPath,
                    type: folderData.type || 'quiz'
                  });
                });
              }
            }
          }
        }
      } catch (e) {
        console.log('Could not load manifest for search');
      }
    }
    
    function handleGlobalSearch(event) {
      const query = event.target.value.toLowerCase().trim();
      const resultsContainer = document.getElementById('searchResults');
      
      if (query.length < 2) {
        resultsContainer.classList.remove('active');
        return;
      }
      
      const filtered = allManifestFiles.filter(file => 
        file.name.toLowerCase().includes(query) ||
        file.folderPath.toLowerCase().includes(query)
      );
      
      if (filtered.length === 0) {
        resultsContainer.innerHTML = '<div class="search-result-item"><span>No results found</span></div>';
        resultsContainer.classList.add('active');
        return;
      }
      
      resultsContainer.innerHTML = filtered.slice(0, 10).map(file => `
        <div class="search-result-item" onclick="openSearchResult('${encodeURIComponent(file.path)}', '${file.type}', '${encodeURIComponent(file.folderPath)}')">
          <i class="fas ${file.type === 'article' ? 'fa-file-medical-alt' : 'fa-question-circle'}"></i>
          <div>
            <div class="result-title">${file.name}</div>
            <div class="result-path">${file.folderPath}</div>
          </div>
        </div>
      `).join('');
      resultsContainer.classList.add('active');
    }
    
    function openSearchResult(path, type, folderPathEncoded) {
      const decodedPath = decodeURIComponent(path);
      const decodedFolderPath = decodeURIComponent(folderPathEncoded);
      const fileName = decodedPath.split('/').pop().replace('.json', '').replace(/_/g, ' ');
      
      if (type === 'article') {
        window.location.href = `article.html?folder=${encodeURIComponent(fileName)}&folderPath=${encodeURIComponent(decodedFolderPath)}`;
      } else {
        window.location.href = `quiz.html?folder=${encodeURIComponent(fileName)}&folderPath=${encodeURIComponent(decodedFolderPath)}`;
      }
    }
    
    async function initBrowsePage() {
      initPathFromURL();

      const metadata = await loadMetadata();
      if (!metadata) {
        document.getElementById('categoriesGrid').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Failed to load data. Please try again.</p>
          </div>
        `;
        return;
      }

      const current = getCurrentItem();
      if (!current) {
        document.getElementById('categoriesGrid').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Category not found. Please go back and try again.</p>
          </div>
        `;
        return;
      }

      document.getElementById('pageTitle').textContent = current.name;
      
      const statsText = [];
      if (current.stats && current.stats.sub_folders > 0) {
        statsText.push(`${current.stats.sub_folders} folders`);
      }
      if (current.stats && current.stats.questions > 0) {
        statsText.push(`${formatNumber(current.stats.questions)} questions`);
      }
      if (current.stats && current.stats.articles > 0) {
        statsText.push(`${formatNumber(current.stats.articles)} articles`);
      }
      document.getElementById('pageSubtitle').textContent = statsText.join(' | ') || 'Browse content';

      document.getElementById('breadcrumbContainer').innerHTML = renderBreadcrumb();

      renderCategories(current.children || []);
    }

    document.addEventListener('DOMContentLoaded', function() {
      initBrowsePage();
      loadManifestForSearch();
    });

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const cards = document.querySelectorAll('.category-card, .content-folder-card');
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(query) ? 'flex' : 'none';
      });
    });
  </script>

<!-- Rewarded ad logic (cooldown + out‑of‑page) -->
<script>
  (function() {
    const COOLDOWN_MS = 600000; // 1 hour
    const lastAdTime = localStorage.getItem('hasShownRewardedAd');
    const now = Date.now();
    if (lastAdTime && (now - parseInt(lastAdTime, 10)) < COOLDOWN_MS) {
      console.log('⏳ Ad cooldown active – skipping.');
      return;
    }

    window.googletag = window.googletag || { cmd: [] };
    googletag.cmd.push(() => {
      const adSlotRewarded = googletag
        .defineOutOfPageSlot('/23205238319/Rewarded_ads6', googletag.enums.OutOfPageFormat.REWARDED)
        .addService(googletag.pubads());

      adSlotRewarded.setForceSafeFrame(true);
      googletag.pubads().enableAsyncRendering();
      googletag.enableServices();

      const modal = document.getElementById('rewardModal');
      const closeButton = modal ? modal.querySelector('.btn') : null;

      window.addEventListener('popstate', function() {
        history.pushState(null, null, location.href);
      });

      googletag.pubads().addEventListener('impressionViewable', function() {
        console.log('👀 Ad impression viewable');
        if (closeButton) {
          setTimeout(() => { closeButton.style.display = 'block'; }, 30000);
        }
      });

      googletag.pubads().addEventListener('slotRenderEnded', function(event) {
        if (event.isEmpty) {
          console.log('❌ Ad empty or failed');
          if (modal) {
            modal.style.display = 'none';
          }
        }
      });

      googletag.pubads().addEventListener('rewardedSlotReady', function(event) {
        if (modal) {
          modal.style.display = 'flex'; // show modal
        }
        event.makeRewardedVisible();
      });

      googletag.pubads().addEventListener('rewardedSlotClosed', function() {
        if (modal) {
          modal.style.display = 'none';
        }
        localStorage.setItem('hasShownRewardedAd', Date.now().toString());
      });

      googletag.display(adSlotRewarded);
    });
  })();
</script>
