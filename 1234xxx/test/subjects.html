<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marrow 8.0 Subjects - NEXTPULSE | NEET PG Video Lectures</title>
  <meta name="description" content="Access Marrow's comprehensive NEET PG video lectures across all medical subjects including Anatomy, Physiology, Pathology, and more.">
  <meta name="keywords" content="Marrow, NEET PG, medical subjects, anatomy, physiology, pathology, video lectures">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="../../access-control.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5920367457745298" crossorigin="anonymous"></script>
</head>
<body>
  <script>
    if (!accessControl.initProtectedPage()) {
      throw new Error('Access denied - redirecting to index.html');
    }
  </script>

  <header>
    <div class="header-content">
      <button onclick="history.back()" style="position:fixed;top:20px;left:20px;background:transparent;color:white;border:none;padding:10px;cursor:pointer;z-index:1001;font-size:20px;">
        <i class="fas fa-arrow-left"></i>
      </button>
      <h1>Marrow 8.0 Subjects</h1>
      <p class="header-subtitle">Premium Video Lectures</p>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search subjects..." id="searchInput">
      </div>
    </div>
  </header>

  <main>

    <!-- ═══════════════════════════════════════════════════════════════
         LOCKED SUBJECT: Anatomy — costs 100 coins
         ───────────────────────────────────────────────────────────────
         TO CHANGE COIN COST : edit  data-lock-coins="100"
         TO UNLOCK (make free): remove all 4  data-lock-*  attributes
                                and add back  onclick="window.location.href='manatomy.html'"
         ═══════════════════════════════════════════════════════════════ -->
    <div class="subject-card"
      data-lock-id="marrow8-anatomy"
      data-lock-coins="100"
      data-lock-label="Marrow 8.0 — Anatomy"
      data-lock-href="anatomy.html">
      <i class="fas fa-user-injured"></i>
      <span>Anatomy</span>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         LOCKED SUBJECT: Biochemistry — costs 200 coins
         ───────────────────────────────────────────────────────────────
         TO CHANGE COIN COST : edit  data-lock-coins="200"
         TO UNLOCK (make free): remove all 4  data-lock-*  attributes
                                and add back  onclick="window.location.href='mbiochemistry.html'"
         ═══════════════════════════════════════════════════════════════ -->
    <div class="subject-card"
      data-lock-id="marrow8-biochemistry"
      data-lock-coins="200"
      data-lock-label="Marrow 8.0 — Biochemistry"
      data-lock-href="clinicalguruji.html">
      <i class="fas fa-flask"></i>
      <span>Biochemistry</span>
    </div>

    <!-- FREE subject (no data-lock-* attributes = always accessible) -->
    <div class="subject-card" onclick="window.location.href='mmedicine.html'">
      <i class="fas fa-syringe"></i>
      <span>Medicine</span>
    </div>

  
    <div class="subject-card" onclick="window.location.href='Anatomy.html'">
      <i class="fas fa-heartbeat"></i>
      <span>Anatomy</span>
    </div>

    <div class="subject-card" onclick="window.location.href='pwtest.html'">
      <i class="fas fa-deaf"></i>
      <span>pwtest</span>
    </div>

    <div class="subject-card" onclick="window.location.href='test.html'">
      <i class="fas fa-radiation"></i>
      <span>test</span>
    </div>

    <div class="subject-card" onclick="window.location.href='test1.html'">
      <i class="fas fa-band-aid"></i>
      <span>test1</span>
    </div>


    <div class="subject-card" onclick="window.location.href='ANATOMY.html'">
      <i class="fas fa-microscope"></i>
      <span>ANATOMY</span>
    </div>


    <div class="subject-card" onclick="window.location.href='Marrow ss.html'">
      <i class="fas fa-flask"></i>
      <span>Marrow ss</span>
    </div>

    <div class="subject-card" onclick="window.location.href='xANATOMY.html'">
      <i class="fas fa-diagnoses"></i>
      <span>xANATOMY</span>
    </div>


    <div class="subject-card" onclick="window.location.href='msample.html'">
      <i class="fas fa-virus"></i>
      <span>msample</span>
    </div>

</main>

  <script>
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll('.subject-card').forEach(card => {
        card.style.display = card.textContent.toLowerCase().includes(query) ? 'block' : 'none';
      });
    });
  </script>

  <!-- card-lock.js handles lock/unlock for cards with data-lock-* attributes above -->
  <script src="../../card-lock.js"></script>

  <script src="../../stream-player-utils.js"></script>
  <script src="../../theme.js"></script>

  <nav class="bottom-nav">
    <a href="../../appx.html" class="active"><i class="fas fa-lightbulb"></i><span>Home</span></a>
    <a href="../../00x12345.html"><i class="fas fa-play-circle"></i><span>Videos</span></a>

  </nav>

</html>
