<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDICINE Subjects - NEXTPULSE | NEET PG Video Lectures</title>
  <meta name="description" content="Access MEDICINE NEET PG video lectures across all medical subjects.">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="../../../access-control.js"></script>
</head>
<body>
  <script>
    if (!accessControl.initProtectedPage()) {
      throw new Error('Access denied - redirecting to index.html');
    }
  </script>
  <header>
    <div class="header-content">
      <button onclick="history.back()" style="position: fixed; top: 20px; left: 20px; background: transparent; color: white; border: none; padding: 10px; cursor: pointer; z-index: 1001; font-size: 20px;">
        <i class="fas fa-arrow-left"></i>
      </button>
      <h1>MEDICINE Subjects</h1>
      <p class="header-subtitle">Expert Faculty Video Lectures</p>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search subjects..." id="searchInput">
      </div>
    </div>
  </header>
  <main>
    <div class="subject-card" onclick="window.location.href='Cardiology.html'">
      <i class="fas fa-notes-medical"></i>
      <span>Cardiology</span>
    </div>

    <div class="subject-card" onclick="window.location.href='Derma and Rheumatology.html'">
      <i class="fas fa-procedures"></i>
      <span>Derma and Rheumatology</span>
    </div>

    <div class="subject-card" onclick="window.location.href='Endocrinology.html'">
      <i class="fas fa-ambulance"></i>
      <span>Endocrinology</span>
    </div>

    <div class="subject-card" onclick="window.location.href='Gastroenterology.html'">
      <i class="fas fa-radiation"></i>
      <span>Gastroenterology</span>
    </div>

    <div class="subject-card" onclick="window.location.href='Nephrology.html'">
      <i class="fas fa-radiation"></i>
      <span>Nephrology</span>
    </div>

    <div class="subject-card" onclick="window.location.href='Neurology.html'">
      <i class="fas fa-prescription"></i>
      <span>Neurology</span>
    </div>

    <div class="subject-card" onclick="window.location.href='Notes.html'">
      <i class="fas fa-biohazard"></i>
      <span>Notes</span>
    </div>

    <div class="subject-card" onclick="window.location.href='Pulmonology.html'">
      <i class="fas fa-stethoscope"></i>
      <span>Pulmonology</span>
    </div>


  
    <div class="subject-card" onclick="window.location.href='Rapid Revision.html'">
      <i class="fas fa-baby"></i>
      <span>Rapid Revision</span>
    </div>

</main>

  <script>
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const subjects = document.querySelectorAll('.subject-card');
      subjects.forEach(subject => {
        const text = subject.textContent.toLowerCase();
        subject.style.display = text.includes(query) ? 'block' : 'none';
      });
    });
  </script>
  <script src="../../../stream-player-utils.js"></script>
  <script src="../../../theme.js"></script>
  <nav class="bottom-nav">
    <a href="../../../appx.html" class="active"><i class="fas fa-lightbulb"></i><span>Home</span></a>
    <a href="../../../00x12345.html"><i class="fas fa-play-circle"></i><span>Videos</span></a>
    <a href="../../../searchx.html"><i class="fas fa-search"></i><span>Search</span></a>
    <a href="../../../quizx/index.html"><i class="fas fa-question-circle"></i><span>Q Bank</span></a>
  </nav>
</body>
</html>
