<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDLIVE Subjects - NEXTPULSE | NEET PG Video Lectures</title>
  <meta name="description" content="Access MEDLIVE NEET PG video lectures across all medical subjects.">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="../../access-control.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5920367457745298" crossorigin="anonymous"></script>
</head>
<body>
  <script>
    if (!accessControl.initProtectedPage()) {
      throw new Error('Access denied - redirecting to index.html');
    }
  </script>
  <header>
    <div class="header-content">
      <button onclick="history.back()" style="position: fixed; top: 20px; left: 20px; background: transparent; color: white; border: none; padding: 10px; cursor: pointer; z-index: 1001; font-size: 20px;">
        <i class="fas fa-arrow-left"></i>
      </button>
      <h1>MEDLIVE Subjects</h1>
      <p class="header-subtitle">Expert Faculty Video Lectures</p>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search subjects..." id="searchInput">
      </div>
    </div>
  </header>
  <main>
    <div class="subject-card" onclick="window.location.href='Microbiology.html'">
      <i class="fas fa-child"></i>
      <span>Microbiology</span>
    </div>

    <div class="subject-card" onclick="window.location.href='Pathology.html'">
      <i class="fas fa-head-side-mask"></i>
      <span>Pathology</span>
    </div>

    <div class="subject-card" onclick="window.location.href='Pharmacology.html'">
      <i class="fas fa-stethoscope"></i>
      <span>Pharmacology</span>
    </div>

    <div class="subject-card" onclick="window.location.href='Psm.html'">
      <i class="fas fa-file-medical"></i>
      <span>Psm</span>
    </div>

    <div class="subject-card" onclick="window.location.href='TND.html'">
      <i class="fas fa-band-aid"></i>
      <span>TND</span>
    </div>

    <div class="subject-card" onclick="window.location.href='Workbook.html'">
      <i class="fas fa-radiation"></i>
      <span>Workbook</span>
    </div>


  </main>

  <script>
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const subjects = document.querySelectorAll('.subject-card');
      subjects.forEach(subject => {
        const text = subject.textContent.toLowerCase();
        subject.style.display = text.includes(query) ? 'block' : 'none';
      });
    });
  </script>
  <script src="../../stream-player-utils.js"></script>
  <script src="../../theme.js"></script>
  <nav class="bottom-nav">
    <a href="../../app.html" class="active"><i class="fas fa-lightbulb"></i><span>Home</span></a>
    <a href="../../00x12345.html"><i class="fas fa-play-circle"></i><span>Videos</span></a>
    <a href="../../searchx.html"><i class="fas fa-search"></i><span>Search</span></a>
    <a href="../../quizx/index.html"><i class="fas fa-question-circle"></i><span>Q Bank</span></a>
  </nav>
</body>
</html>
